<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Eid Greeting</title>

<style>
body {
  text-align: center;
  font-family: Arial;
  background: #f5f5f5;
}

h2 {
  line-height: 1.8;
  font-size: 26px;
}

input {
  padding: 12px;
  width: 260px;
  font-size: 16px;
}

button {
  padding: 12px 25px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 10px;
}

canvas {
  margin-top: 20px;
  border-radius: 10px;
}
</style>

</head>

<body>

<!-- ✅ العنوان -->
<h2>
⭐ عيد أضحى مبارك <br>
اكتب اسمك وخذ معايدتك <br><br>
Eid Al-Adha Mubarak <br>
Enter your name and get your greeting
</h2>

<!-- ✅ الإدخال -->
<input type="text" id="name" placeholder="اكتب اسمك / Type your name" oninput="preview()">

<br>

<!-- ✅ زر التحميل -->
<button onclick="download()">تحميل / Download</button>

<br>

<!-- ✅ عرض الصورة -->
<canvas id="canvas" width="1080" height="1350"></canvas>

<script>
var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");

var img = new Image();
img.src = "card.png";

// تحميل أولي
img.onload = function () {
  draw("");
};

// عرض الاسم مباشرة
function preview() {
  var name = document.getElementById("name").value;
  draw(name);
}

// رسم الصورة + الاسم
function draw(name) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  // الخط
  ctx.font = "bold 55px Arial";
  ctx.fillStyle = "#0f2f35";
  ctx.textAlign = "center";

  // ظل بسيط
  ctx.shadowColor = "rgba(0,0,0,0.3)";
  ctx.shadowBlur = 4;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 2;

  // كتابة الاسم
  ctx.fillText(name, canvas.width / 2, 1120);
}

// تحميل الصورة
function download() {
  var link = document.createElement('a');
  link.download = 'Eid_Greeting.png';
  link.href = canvas.toDataURL();
  link.click();
}
</script>

</body>
</html>
