<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eid Greeting</title>
</head>

<body style="text-align:center; font-family:Arial;">

<h2>🎉 اكتب اسمك / Enter Your Name</h2>

<input type="text" id="name" placeholder="اكتب اسمك / Type your name" oninput="preview()" style="padding:10px; width:250px;">
<br><br>

<button onclick="download()" style="padding:10px 20px; font-size:16px;">
تحميل / Download
</button>

<br><br>

<canvas id="canvas" width="1080" height="1350"></canvas>

<script>
var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");

var img = new Image();
img.src = "card.png";

// أول تحميل
img.onload = function () {
  draw("");
};

// ✅ عرض الاسم مباشرة
function preview() {
  var name = document.getElementById("name").value;
  draw(name);
}

// ✅ رسم الصورة + الاسم
function draw(name) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  // إعداد الخط (كبير + عريض)
  ctx.font = "bold 70px Arial";
  ctx.fillStyle = "#0f2f35";
  ctx.textAlign = "center";

  // ظل خفيف
  ctx.shadowColor = "rgba(0,0,0,0.3)";
  ctx.shadowBlur = 4;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 2;

  // كتابة الاسم
  ctx.fillText(name, canvas.width / 2, 1120);
}

// ✅ تحميل الصورة
function download() {
  var link = document.createElement('a');
  link.download = 'Eid_Greeting.png';
  link.href = canvas.toDataURL();
  link.click();
}
</script>

</body>
</html>
